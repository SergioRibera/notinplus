# xcodegen spec. Generate the .xcodeproj with:
#
#     cd ios && xcodegen generate
#
# `.xcodeproj` is not checked in — regen is deterministic.

name: NotinplusApp

# Auto-generated by `istmo_build::emit()`; carries source group refs
# for every declared plugin's `native/ios/` directory. Re-runs every
# `cargo build`, so keep it merged rather than inlining the paths.
include:
  - path: NotinplusApp/istmo-plugins.yml

options:
  bundleIdPrefix: rs.sergioribera.notinplus
  deploymentTarget:
    iOS: 14.0
  createIntermediateGroups: true
  defaultConfig: Debug

packages:
  # Local istmo checkout — the SPM manifest lives at the repo root and
  # exposes `IstmoRuntime` from `runtime/ios/Sources/IstmoRuntime`.
  # Swap for `url:` + `from:` once a runtime version is tagged.
  IstmoRuntime:
    path: ../../istmo

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 14.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LIBRARY_SEARCH_PATHS:
      - $(inherited)
      - $(PROJECT_DIR)/build/rust/$(PLATFORM_NAME)/$(CURRENT_ARCH)
    OTHER_LDFLAGS:
      - $(inherited)
      - -lnotinplus

targets:
  NotinplusApp:
    type: application
    platform: iOS
    sources:
      - path: NotinplusApp
    info:
      path: NotinplusApp/Info.plist
    dependencies:
      - package: IstmoRuntime
        product: IstmoRuntime
      # `freya-pdf` loads pdfium at runtime via `dlopen`. Embedding
      # the framework with `Embed & Sign` puts `pdfium` inside
      # `Frameworks/`, which lands on `@rpath` so the loader finds it
      # without extra `DYLD_*` plumbing. The xcframework is fetched
      # by `fetch-pdfium.sh` as part of the preBuild phase.
      - framework: Vendor/pdfium.xcframework
        embed: true
    preBuildScripts:
      - name: fetch pdfium.xcframework (bblanchon prebuilts)
        path: fetch-pdfium.sh
        runOnlyWhenInstalling: false
      - name: cargo build notinplus (staticlib per arch)
        path: build-rust.sh
        runOnlyWhenInstalling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.sergioribera.notinplus
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor
