name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same derivations the release builds, so a green CI run also warms
  # attic for the next tag. Every crate is its own derivation (nix/per-crate.nix):
  # `watch-store` uploads each one as it lands, so a job that fails halfway
  # still caches what it finished, and the final push covers the build
  # closure, which the runtime closure of the result leaves out.
  desktop:
    name: Desktop + relay (x86_64-linux, Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - id: nix
        uses: ./.github/actions/setup-nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          watch-store: "true"

      - name: Cargo.nix matches Cargo.lock
        run: |
          nix run nixpkgs#crate2nix -- generate -f Cargo.toml -o nix/Cargo.nix -h nix/crate-hashes.json
          git diff --exit-code -- nix/Cargo.nix nix/crate-hashes.json \
            || { echo "::error::nix/Cargo.nix is stale: run \`just cargo-nix\`"; exit 1; }

      - name: Build app
        run: nix build -L .#notinplus -o result-app

      - name: Build relay
        run: nix build -L .#relay -o result-relay

      - name: Push crates and results to attic
        if: always()
        uses: ./.github/actions/attic-push
        with:
          push-enabled: ${{ steps.nix.outputs.push-enabled }}
          paths: result-app result-relay
          closure-of: .#notinplus .#relay

  # Same cross build the release ships; catches Windows-only compile errors
  # without a Windows runner.
  windows:
    name: Desktop (x86_64-windows, Nix cross)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - id: nix
        uses: ./.github/actions/setup-nix
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          watch-store: "true"

      - name: Build app
        run: nix build -L .#notinplus-windows -o result-app

      - name: Push crates and app to attic
        if: always()
        uses: ./.github/actions/attic-push
        with:
          push-enabled: ${{ steps.nix.outputs.push-enabled }}
          paths: result-app
          closure-of: .#notinplus-windows

  android:
    name: Android (debug, arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/android-build
        with:
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          task: ":app:assembleDebug"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
