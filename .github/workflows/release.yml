name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:

  github-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: cachix/install-nix-action@v27
      - run: nix build .#bundle
      - uses: softprops/action-gh-release@v2
        with:
          files: result/*
      

