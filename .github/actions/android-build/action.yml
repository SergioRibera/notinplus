name: Android build (Nix)
description: >-
  Builds the Rust side for every ABI with Nix (nix/android.nix), pushing
  both layers to attic, then runs a Gradle task through
  `nix run .#android-gradle`, which only packages the prebuilt `.so`s.

inputs:
  attic-token:
    description: Attic push token; empty → read-only cache.
    required: false
    default: ""
  task:
    description: Gradle task to run.
    required: true
  abis:
    description: >-
      Comma-separated ABIs. Non-empty → `-Pnotinplus.abis`, which turns on
      per-ABI split APKs plus a universal one. Empty → single-ABI build.
    required: false
    default: ""
  per-crate:
    description: >-
      `true` → the one-derivation-per-crate build (nix/cross-crates.nix):
      every crate lands in attic as it is built, and Gradle packages
      `.#android-jniLibs-per-crate`.
    required: false
    default: "false"
  keystore-base64:
    description: Base64 release keystore. Empty → release builds are signed with the debug key.
    required: false
    default: ""
  keystore-password:
    required: false
    default: ""
  key-alias:
    required: false
    default: ""
  key-password:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: nix
      uses: ./.github/actions/setup-nix
      with:
        attic-token: ${{ inputs.attic-token }}
        watch-store: ${{ inputs.per-crate }}

    # Pushed on its own first: a failure further down still leaves the
    # dependency layer in attic, so the retry starts from the app crate.
    - name: Build Rust dependencies (every ABI)
      if: inputs.per-crate != 'true'
      shell: bash
      run: nix build -L .#android-cargoArtifacts -o result-android-deps

    - name: Push dependencies to attic
      if: always() && inputs.per-crate != 'true'
      uses: ./.github/actions/attic-push
      with:
        push-enabled: ${{ steps.nix.outputs.push-enabled }}
        paths: result-android-deps

    - name: Build Rust libraries (every ABI)
      shell: bash
      run: nix build -L .#android-jniLibs${{ inputs.per-crate == 'true' && '-per-crate' || '' }} -o result-android-jnilibs

    - name: Push libraries to attic
      if: always()
      uses: ./.github/actions/attic-push
      with:
        push-enabled: ${{ steps.nix.outputs.push-enabled }}
        paths: result-android-jnilibs
        closure-of: ${{ inputs.per-crate == 'true' && '.#android-jniLibs-per-crate' || '' }}

    - name: Gradle ${{ inputs.task }}
      shell: bash
      env:
        TASK: ${{ inputs.task }}
        ABIS: ${{ inputs.abis }}
        KEYSTORE_B64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        GRADLE_APP: android-gradle${{ inputs.per-crate == 'true' && '-per-crate' || '' }}
      run: |
        set -euo pipefail

        # Secrets pasted with a trailing newline would never match.
        KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
        KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
        KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

        # The debug signing config points at ~/.android/debug.keystore,
        # which a fresh runner lacks and Gradle won't create for a custom
        # signing config.
        mkdir -p "$HOME/.android"
        if [ ! -f "$HOME/.android/debug.keystore" ]; then
          nix develop .#android -c keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

        if [ -n "$KEYSTORE_B64" ]; then
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/keystore/release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ANDROID_KEY_ALIAS="$KEY_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          # Fail with the aliases the store does hold, instead of Gradle's
          # "No key with alias" deep in packageRelease.
          if ! nix develop .#android -c keytool -list -keystore "$ANDROID_KEYSTORE_FILE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The release keystore has no key named by ANDROID_KEY_ALIAS, or ANDROID_KEYSTORE_PASSWORD does not open it. Keys in the store:"
            nix develop .#android -c keytool -list -keystore "$ANDROID_KEYSTORE_FILE" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>&1 | grep -iE "entry|error" || true
            exit 1
          fi
        else
          echo "::warning::No release keystore configured; APKs are signed with an ephemeral debug key (updates between releases will not install over each other)."
        fi

        gradle_args=("$TASK" --stacktrace)
        [ -n "$ABIS" ] && gradle_args+=("-Pnotinplus.abis=$ABIS")
        nix run ".#$GRADLE_APP" -- "${gradle_args[@]}"
