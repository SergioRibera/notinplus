[package]
name = "glyph-bake"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Offline baker for notin-handwriting: recognition templates from UJIpenchars2 and font glyph ink."
repository = "https://github.com/SergioRibera/notinplus"
publish = false

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this workspace keeps on.
redundant_pub_crate = "allow"

[dependencies]
notin-handwriting = { path = "../../crates/notin-handwriting" }
ttf-parser = "0.25"
