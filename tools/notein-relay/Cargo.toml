[package]
name = "notein-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Always-on relay for notinplus shares: stores and forwards sealed records it cannot read."
repository = "https://github.com/SergioRibera/notinplus"
publish = false

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"

[dependencies]
notein-sync = { path = "../../crates/notein-sync" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
