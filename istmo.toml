# App-side istmo.toml — declarative overrides consumed by `istmo-build`.

# ---------------------------------------------------------------------------
# [app] — app identity + Kotlin/Swift codegen controls.
# ---------------------------------------------------------------------------
# `id`/`name` flow into Gradle (via `io.github.sergioribera.istmo`) and Xcode
# (through the generated `ios/.istmo/Istmo.xcconfig`). Version comes from
# Cargo.toml.
#
# The pen plugin's native Kotlin sources import `dev.istmo.runtime.PenBackend`
# / `PenEvent` / … directly, so the generated dispatcher + types must land in
# that same package. Override the default `<namespace>.gen` accordingly.
[app]
id              = "rs.sergioribera.notinplus"
name            = "NotIn Plus"
# Android versionCode; set from the version by scripts/set-version-code.sh
# on every `cargo release`.
build           = 1000
android_package = "dev.istmo.runtime"

# Launcher icon: the iOS app icon and the legacy Android mipmaps come from
# `image`; Android 8+ uses the adaptive layers (paper + margin rule behind,
# the handwritten n in front); desktops (window, Windows .exe) take the
# rounded tile, since nothing masks icons there.
[app.icon]
image   = "assets/brand/ios/AppIcon-1024.png"
desktop = "assets/brand/png/notinplus-tile-1024.png"

[app.icon.android]
foreground = "assets/brand/android/ic_launcher_foreground.xml"
background = "assets/brand/android/ic_launcher_background.xml"
monochrome = "assets/brand/android/ic_launcher_monochrome.xml"

# Files the system can open with the app. Packaging (nix-bundle-app
# `fileAssociations`, via `builtins.fromTOML` in flake.nix) reads the same
# table for desktop entries, the macOS .app and Windows ProgIDs.
[[app.document_type]]
name       = "PDF document"
id         = "com.adobe.pdf"
extensions = ["pdf"]
mime_types = ["application/pdf"]
role       = "editor"

[[app.document_type]]
name       = "Markdown document"
id         = "net.daringfireball.markdown"
extensions = ["md", "markdown"]
mime_types = ["text/markdown", "text/x-markdown"]
role       = "editor"

[[app.document_type]]
name        = "Plain text"
id          = "public.plain-text"
extensions  = ["txt"]
mime_types  = ["text/plain"]
role        = "editor"

[[app.document_type]]
name       = "NotIn Plus document"
id         = "rs.sergioribera.notinplus.notin"
extensions = ["notin"]
mime_types = ["application/x-notin"]
role       = "editor"
rank       = "owner"
exported   = true

[[app.document_type]]
name       = "NotIn Plus plugin"
id         = "rs.sergioribera.notinplus.plugin"
extensions = ["ntp"]
mime_types = ["application/x-notinplus-plugin"]
rank       = "owner"
exported   = true

# Oldest OS releases we ship to. Android 26 = Oreo (first ART-only + first
# storage-scoped SDK); iOS 14 matches the rest of the workspace examples.
# Usage strings shown by iOS, in the app's language.
[app.info_plist]
NSCameraUsageDescription = "Para escanear el código QR de otro dispositivo o de una invitación."
NSPhotoLibraryAddUsageDescription = "Para guardar en Fotos las imágenes que compartís."

[min_versions]
android = 26
ios     = "14.0"

# Per-plugin role / platform overrides. Default role is `host` (Rust calls
# the plugin, native side implements the backend). Set `role = "client"` for
# Rust-hosted plugins the native side needs to call.
#
# [[app.plugin]]
# id        = "istmo.echo"
# role      = "client"
# platforms = ["android"]

# Force a specific plugin to run in the `:remote` process instead of its
# default deployment. Match the plugin's declared `id` from its own
# istmo.toml (usually `<org>.<name>`).
#
# [[remote_override]]
# plugin     = "acme.example_plugin"
# deployment = "remote"

# Extra Gradle / Swift-package dependencies for the app itself (rare —
# plugins normally carry their own via their `istmo.toml`).
#
# [[gradle]]
# group    = "androidx.security"
# artifact = "security-crypto"
# version  = "1.1.0-alpha06"
#
# [[swift_package]]
# url          = "https://github.com/siteline/SwiftUI-Introspect"
# product      = "SwiftUIIntrospect"
# from_version = "1.1.4"
