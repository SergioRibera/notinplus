[package]
name = "notinplus-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
notin-sync = { path = "../crates/notin-sync" }

# Fuzz targets build on nightly with their own flags; keep them out of the
# main workspace and its lockfile.
[workspace]

[patch.crates-io]
# Same istmo as the app (see the root manifest).
istmo-core = { git = "https://github.com/SergioRibera/istmo", rev = "b3ede16" }

[[bin]]
name = "sync"
path = "fuzz_targets/sync.rs"
test = false
doc = false
bench = false
