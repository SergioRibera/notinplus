[package]
name         = "notin-sdk"
version      = "0.1.0-alpha.3"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Sergio Ribera <contact@sergioribera.rs>"]
description  = "Plugin author SDK: the notin-plugin surface plus a prelude."
repository   = "https://github.com/SergioRibera/notinplus"
publish = false
keywords = ["notinplus", "plugin", "sdk", "freya", "notes"]
categories = ["gui", "development-tools"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
notin-plugin = { version = "0.1.0-alpha.3", path = "../notin-plugin" }
