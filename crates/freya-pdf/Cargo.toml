[package]
name        = "freya-pdf"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.85"
license     = "MIT OR Apache-2.0"
authors     = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "PDF rendering backend for Freya canvases: async worker pool, LRU tile cache, virtualised page stack. Integrates via freya-canvas-bg."
repository  = "https://github.com/SergioRibera/notinplus"

# hashlink lands in M4 alongside the LRU tile cache. M3 uses
# pdfium-render synchronously (one page per paint call) — enough to
# prove the round-trip without an async pool yet.
[dependencies]
freya-canvas-bg = { path = "../freya-canvas-bg" }
freya-engine    = "0.4"
# Default features pick a PDFium API version (`pdfium_latest` →
# 7543-shaped bindings) and enable `thread_safe`; `sync` layers a
# `Send + Sync` Mutex over the bindings so multiple threads can drive
# Pdfium once the M4 worker pool lands. Pdfium's shared library is
# resolved at runtime via `Pdfium::bind_to_system_library` — apps
# ship the binary through their platform packaging (nix devshell,
# APK jniLibs, iOS xcframework, etc.).
pdfium-render   = { version = "0.8", features = ["sync"] }
log             = "0.4"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
