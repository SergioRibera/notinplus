[package]
name = "notin-sync"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Device identity, share keys and the replica exchange that keeps notinplus libraries in step across devices and people."
repository = "https://github.com/SergioRibera/notinplus"
publish = false

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# `fuzz/` builds with `--cfg fuzzing` to reach the decoders.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this crate keeps on.
redundant_pub_crate = "allow"

[features]
sismo = ["dep:sismo"]

[dependencies]
# Spans for the sismo profiler; off unless an app turns it on.
sismo = { version = "0.1.1", default-features = false, optional = true }
zudp = { version = "0.4", features = ["security", "discovery", "relay"] }
wincode = { version = "0.6", default-features = false, features = ["derive", "std"] }
# The wire codec and its bounded decoding.
istmo-core = "0.1.1-alpha.5"
blake2 = "0.10"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
flume = { version = "0.11", features = ["async"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
# Signs what members leave in a relay mailbox, which a share key alone
# cannot attribute.
ed25519-dalek = "3.0"
# Compares secrets without telling how much of a guess was right.
subtle = "2.6"
# X25519 between two devices, to hand a new share key to each member alone.
curve25519-dalek = "5.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
