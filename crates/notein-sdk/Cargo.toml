[package]
name         = "notein-sdk"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Sergio Ribera <contact@sergioribera.rs>"]
description  = "Plugin author SDK — reexports the notein-plugin surface plus codec and builder helpers."
repository   = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
notein-plugin = { path = "../notein-plugin" }
