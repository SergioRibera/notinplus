[package]
name = "istmo-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Hand a downloaded installer to the system for the istmo framework: the Android package installer and the Windows setup programs."
repository = "https://github.com/SergioRibera/notinplus"
publish = false
links = "istmo_installer"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
redundant_pub_crate = "allow"

[dependencies]
istmo-core = "0.1.1-alpha.4"
istmo-macros = "0.1.1-alpha.4"
bincode = { version = "2", features = ["derive", "std"] }

[build-dependencies]
istmo-build = "0.1.1-alpha.4"
