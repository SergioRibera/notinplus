[package]
name = "notin-beautify"
version = "0.1.0-alpha.5"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Ink beautification: straighten and even out handwritten words, snap drawn strokes to clean shapes."
repository = "https://github.com/SergioRibera/notinplus"
publish = false
keywords = ["ink", "handwriting", "stylus", "shapes", "geometry"]
categories = ["graphics", "mathematics"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this crate keeps on.
redundant_pub_crate = "allow"

[features]
sismo = ["dep:sismo"]

[dependencies]
# Spans for the sismo profiler; off unless an app turns it on.
sismo = { version = "0.1.1", default-features = false, optional = true }
# Wire codec of the corrections stored on strokes.
wincode = { version = "0.6", default-features = false, features = ["derive", "std"] }
