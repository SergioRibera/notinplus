[package]
name = "notein-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Device identity, share keys and the replica exchange that keeps notinplus libraries in step across devices and people."
repository = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
zudp = { path = "../../../../GamerOS/zudp", features = ["security", "discovery"] }
bincode = { version = "2", features = ["derive", "std"] }
blake2 = "0.10"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.8"
tracing = "0.1"
flume = { version = "0.11", features = ["async"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
