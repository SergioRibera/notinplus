[package]
name = "notein-handwriting"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Handwritten character recognition (DTW trace matcher with composed diacritics) and font glyph ink for notinplus."
repository = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this workspace keeps on.
redundant_pub_crate = "allow"

[features]
sismo = ["dep:sismo"]

[dependencies]
# Spans for the sismo profiler; off unless an app turns it on.
sismo = { path = "../../../../sismo/crates/sismo", default-features = false, optional = true }
rkyv = { version = "0.8", default-features = false, features = [
    "std",
    "bytecheck",
    "little_endian",
    "pointer_width_32",
] }
