[package]
name = "notein-bible"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Bible source + canvas plugin for notinplus (SQLite + FTS5 backed, custom reading UI)."
repository = "https://github.com/SergioRibera/notinplus"

[lib]
# `rlib` keeps the in-process built-in path open; `cdylib` emits the
# shared library the dynamic loader (libloading + manifest discovery)
# dlopens at runtime. Both consumers compile against the same source so
# the two paths cannot drift.
crate-type = ["cdylib", "rlib"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
default = []
# Guarded import pipeline — pulls `reqwest` + `serde_json`. Off by
# default so headless library bins (tests, CLIs) don't drag the HTTP
# stack. Flip on in the host binary that bundles the plugin.
importer = ["dep:reqwest", "dep:serde", "dep:serde_json"]
# Freya rsx components. Off by default so library + import tests do not
# drag the GPU stack. The host enables this to render the Bible viewer.
ui = [
    "dep:freya",
    "dep:freya-components",
    "dep:freya-core",
    "dep:async-io",
    "dep:notein-ui-kit",
]

[dependencies]
notein-sdk = { path = "../notein-sdk" }
# `istmo-core` is pulled in strictly for its `path::data_dir()`
# resolver so the plugin writes its DB + cache alongside every other
# notein data file. The transport / runtime pieces are unused — the
# core crate itself only depends on `bincode` + `flume` + a tiny set of
# workspace crates, so there is no hidden weight.
istmo-core = { path = "../../../istmo/crates/core" }
rusqlite = { version = "0.37", features = ["bundled"] }
regex = "1.12"
bincode = { version = "2", features = ["derive", "std"] }
log = "0.4"
quick-xml = "0.37"
# Standalone icons crate (no Freya runtime pulled in). `creation_entries`
# needs real SVG bytes the host's SvgViewer can render; emoji text in
# the icon field silently fails to decode.
freya-icons = { version = "=0.4.0", features = ["lucide"] }

reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
    "rustls-tls",
], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

freya = { version = "=0.5.0-rc.8", features = [
    "router",
    "icons",
    "icons-lucide",
], optional = true }
freya-components = { version = "=0.5.0-rc.8", optional = true }
freya-core = { version = "=0.5.0-rc.8", optional = true }
async-io = { version = "2", optional = true }
notein-ui-kit = { path = "../notein-ui-kit", optional = true }
