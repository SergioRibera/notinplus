[package]
name = "freya-markdown-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Block based rich Markdown editor and viewer for Freya, with CommonMark, GFM and common extensions."
repository = "https://github.com/SergioRibera/notinplus"
keywords = ["freya", "markdown", "editor", "gui", "gfm"]
categories = ["gui", "text-editors"]

[features]
default = ["toolbar", "emoji"]
toolbar = []
emoji = ["comrak/shortcodes"]

[dependencies]
freya = { version = "=0.5.0-rc.8", features = ["icons", "icons-lucide"] }
freya-core = "=0.5.0-rc.8"
freya-edit = "=0.5.0-rc.8"
freya-engine = "=0.5.0-rc.8"
comrak = { version = "0.56", default-features = false, features = ["attributes"] }

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
