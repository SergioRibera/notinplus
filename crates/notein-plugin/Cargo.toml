[package]
name         = "notein-plugin"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = ["Sergio Ribera <contact@sergioribera.rs>"]
description  = "Plugin surface (Source / CanvasKind traits + config schema + creation entries) for notinplus."
repository   = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
bincode = { version = "2", features = ["derive", "std"] }
uuid = { version = "1.26.1", features = ["v4"] }
libloading = "0.8"
