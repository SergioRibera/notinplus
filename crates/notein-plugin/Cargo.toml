[package]
name = "notein-plugin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Plugin surface (Source / CanvasKind traits + config schema + creation entries) for notinplus."
repository = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
notein-i18n = { path = "../notein-i18n" }
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
flume = { version = "0.11", features = ["async"] }
bincode = { version = "2", features = ["derive", "std"] }
rkyv = { version = "0.8", default-features = false, features = [
    "std",
    "bytecheck",
    "little_endian",
    "pointer_width_32",
    "uuid-1",
    "bytes-1",
] }
bytes = "1"
freya-core = "=0.5.0-rc.13"
freya-markdown-editor = { path = "../freya-markdown-editor", default-features = false }
log = "0.4"

[build-dependencies]
notein-i18n = { path = "../notein-i18n", features = ["build"] }
