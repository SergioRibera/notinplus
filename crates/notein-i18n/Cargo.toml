[package]
name = "notein-i18n"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Interface languages for notinplus and its plugins: Fluent catalogs per crate, checked at build time."
repository = "https://github.com/SergioRibera/notinplus"

[features]
# Build-script side: discovers `locales/<lang>/*.ftl`, checks them and
# writes the include list `catalog!` reads.
build = ["dep:fluent-syntax"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this crate keeps on.
redundant_pub_crate = "allow"

[dependencies]
fluent = "0.17"
bincode = { version = "2", features = ["derive", "std"] }
log = "0.4"
fluent-syntax = { version = "0.12", optional = true }
