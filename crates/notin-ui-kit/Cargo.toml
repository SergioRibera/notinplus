[package]
name = "notin-ui-kit"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Shared Freya widgets for notinplus plugins (theme, FormInput, ColorWheel)."
repository = "https://github.com/SergioRibera/notinplus"
publish = false
keywords = ["notinplus", "freya", "widgets", "ui", "theme"]
categories = ["gui"]

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[features]
sismo = ["dep:sismo"]

[dependencies]
# Spans for the sismo profiler; off unless an app turns it on.
sismo = { version = "0.1.1", default-features = false, optional = true }
freya = { version = "=0.5.0-rc.13", features = [
    "router",
    "icons",
    "icons-lucide",
] }
freya-components = "=0.5.0-rc.13"
freya-core = "=0.5.0-rc.13"
freya-animation = "=0.5.0-rc.13"
async-io = "2"
notin-i18n = { version = "0.1.0-alpha.2", path = "../notin-i18n" }

[dev-dependencies]
freya-testing = "=0.5.0-rc.13"

[build-dependencies]
notin-i18n = { version = "0.1.0-alpha.2", path = "../notin-i18n", features = ["build"] }
