[package]
name = "notein-ui-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Shared Freya widgets for notinplus plugins (theme, FormInput, ColorWheel)."
repository = "https://github.com/SergioRibera/notinplus"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
freya = { version = "=0.5.0-rc.8", features = [
    "router",
    "icons",
    "icons-lucide",
] }
freya-components = "=0.5.0-rc.8"
freya-core = "=0.5.0-rc.8"
freya-animation = "=0.5.0-rc.8"
async-io = "2"
