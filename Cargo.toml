[package]
name    = "notinplus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Sergio Ribera <contact@sergioribera.rs>"]
description = "Crossplatform Note App"
repository = "https://github.com/SergioRibera/notinplus"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]


[[bin]]
name = "notinplus"
path = "src/main.rs"


[dependencies]
istmo   = "0.1.1-alpha.1"
bincode = { version = "2", features = ["derive", "std"] }
flume   = { version = "0.11", features = ["async"] }
pollster = "0.4"
log      = "0.4"

# Initial plugin clients (only the ones you ticked at generation time).
istmo-google-sign-in = "0.1"


[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"


[target.'cfg(any(target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos"))'.dependencies]



[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "tvos", target_os = "watchos", target_os = "visionos")))'.dependencies]



[build-dependencies]
# `istmo-build` reads `istmo.toml` + walks every `DEP_*_ISTMO_MANIFEST`
# / `DEP_*_ISTMO_CONTRACT` env var emitted by upstream plugin build
# scripts, so build.rs doesn't need per-plugin `codegen` features.
istmo-build = "0.1.1-alpha.1"

[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
