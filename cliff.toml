# git-cliff — Conventional Commits → user-facing release notes.
# https://git-cliff.org/docs/configuration
#
# The notes are what the in-app "new version" notice shows, so only
# changes a user notices are listed (feat / fix / perf). Everything else
# stays in the commit history.

[changelog]
header = ""
trailer = ""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first | trim }}\
{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}\
{% endfor %}\n
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# `<!-- n -->` only orders the groups; `striptags` drops it from the heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
